<!DOCTYPE html>
<html lang="ko">
<head>

  <style>

    body {

      flex-direction: column;

    }
    .learning-nav { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px; min-height:52px; font-size:16px; flex-wrap:wrap; }

    #saveRetry { margin:8px; }
    .mic-hint { max-width:90vw; }

    .row-tab .suffix {

    }
    .row-tab:hover { border-color: #c4552a; }

    button {

    .mic {

    .mic.recording::before, .mic.recording::after {
      content: "";

      inset: -4px;

    .unified-warning svg { width:100%; height:100%; display:block; }
    .word-selection { position:absolute; z-index:2; width:12%; aspect-ratio:1; border:clamp(2px,.35cqw,4px) solid #287556; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 5px #28755626; pointer-events:none; }
    .word-selection::after { content:'✓ 선택'; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#287556; color:white; border-radius:12px; padding:3px 9px; font-size:12px; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 16px -10px rgba(154, 62, 28, 0.6); }
      50% { box-shadow: 0 10px 22px -4px rgba(196, 85, 42, 0.95); }

    .score-result.show { display: block; animation: result-appear .24s ease-out; }
    @keyframes result-appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .score-result.show, .mic.recording, .mic.recording::before, .mic.recording::after { animation: none; } }
    .heard-box {
      width: min(100%, 560px);
      min-height: 74px;

    .heard-box span { display: block; color: var(--muted); font-size: 11px; }
    .heard-box b {
      display: block;

    }
    .ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: conic-gradient(var(--ring, var(--pass)) calc(var(--p) * 1%), #eadfce 0);

    }
    .ring span {
      width: 92px;

      background: #f9faef;

      place-items: center;
      align-content: center;
    }
    .ring b { font-size: 30px; line-height: 1; }
    .ring small { font-size: 9px; color: var(--muted); font-weight: 600; }
    .score-copy { min-width: 0; }
    .verdict { font-weight: 800; font-size: 18px; }
    .verdict.pass { color: var(--pass); }

    .diff-line .ok { color: var(--pass); }
    .diff-line .bad { color: #c4322c; text-decoration: underline wavy #c4322c; text-underline-offset: 5px; text-decoration-thickness: 2px; }
    .threshold {

<body class="writing">
  <header>
    <h1>가나 학습 다시 보기</h1>
    <p>고등학교 공통 일본어 I 자료를 플래시 없이 브라우저에서 재생합니다. 소리가 있으면 화면 안 소리 버튼을 눌러 주세요.</p>
  </header>
  <nav class="learning-nav" aria-label="학습 메뉴"><a href="/">かな소리</a><span id="learner"></span><a href="/results.html">나의 결과</a><button id="endSession" type="button">학습 종료</button></nav><main>
    <div class="lesson-fit">
    <nav class="kana-tabs" id="kanaTabs" aria-label="히라가나 행"></nav>
    <div class="bar" id="lessons"></div>
    <div class="bar" id="sections"></div>
    <div class="pages" id="pages"></div>
    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="lesson-title" aria-label="학습 제목"><span id="lessonRowTitle"></span><span class="lesson-title-suffix">발음</span></div>
      <a class="pronunciation-link" id="pronunciationLink" href="#"><img src="pronunciation-button.png?v=1" alt="발음 연습"></a>
      <div class="status" id="status">자료를 불러오는 중입니다.</div>
      <a class="return-link" id="returnToWriting" href="#"><span aria-hidden="true">←</span> 돌아가기</a>
      <div id="warningOverlays" class="warning-overlays" aria-hidden="true"></div>
      <div id="wordSelection" class="word-selection" hidden></div>
    </div>
    <p id="recordLock" hidden>녹음 중에는 &lt;돌아가기&gt; 버튼을 사용할 수 없어요.</p>
    </div>
    <section class="recorder" aria-label="발음 녹음">
      <div class="speaking-card" id="speakingCard">
      <button class="mic" id="micBtn" type="button" aria-label="발음 녹음">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <p class="mic-hint" id="micHint" role="status" aria-live="polite">버튼을 누른 뒤 ‘듣고 있어요’가 표시되면 읽어 주세요. · 70% 이상 통과</p>
      <div class="heard-box" id="heardBox" hidden role="status" aria-live="polite" aria-atomic="true"><span>인식된 발음</span><b id="heardText" lang="ja"></b></div>
      </div>
      <div class="score-result" id="scoreResult" role="status" aria-live="polite" aria-atomic="true">
        <div class="judge-row">
          <div class="ring" id="scoreRing" role="img" aria-label="인식률 0%" style="--p:0"><span aria-hidden="true"><b id="scoreNum">0%</b><small>인식률</small></span></div>
          <div class="score-copy">
            <div class="verdict" id="scoreVerdict"></div>
            <p class="verdict-sub" id="verdictSub"></p>
            <p class="diff-line" id="diffLine"></p>
          </div>
          <button class="retry" id="retryBtn" type="button">다시 연습하기</button>
        </div>
      </div>

    </section>
    <nav class="practice-navigation" aria-label="학습 단계 이동"><a id="backToWriting" href="#">← 획순·글자 연습</a><a id="nextRow" href="#">다음 행 →</a></nav>
  </main>
  <script type="module">
    import { renderWarningIcons } from "../js/warning-icons.js";
    import { LESSONS } from "../js/lessons.js";
    import { setupPractice } from "../js/practice.js?v=68";
    import { WORD_TARGETS, wordTarget } from "../js/word-targets.js?v=18-ha";
    const lessonsEl = document.getElementById("lessons");
    const sectionsEl = document.getElementById("sections");
    const pagesEl = document.getElementById("pages");
    const stage = document.getElementById("stage");
    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    const wordMode = params.get('mode') === 'words';
    document.body.className = wordMode ? 'words' : 'writing';
    const ROWS = LESSONS;
    const tabsEl = document.getElementById("kanaTabs");
    const preferred = ROWS.find(row => row.file === params.get("file"))?.file || ROWS[0].file;

    let catalog = null;
    let lesson = null;
    let section = null;
    let currentFile = preferred;

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle("err", Boolean(isError));
    }

    function pageLabel(file) {
      const name = file.split("/").pop().replace(/\.swf$/i, "");
      const match = name.match(/-(\d+)$/);
      return match ? match[1].replace(/^0/, "") + "쪽" : name;
    }

    function button(label, active, onClick) {
      const el = document.createElement("button");
      el.type = "button";
      el.textContent = label;
      el.classList.toggle("active", active);
      el.addEventListener("click", () => { if (!practice.busy) onClick(); });
      return el;
    }

    function renderLessons() {
      lessonsEl.replaceChildren();
      catalog.lessons.forEach((item) => {
        lessonsEl.append(button(item.title, item.id === lesson.id, () => {
          lesson = item;
          section = item.sections.find((part) => part.id === "03") || item.sections[0];
          currentFile = section.shell;
          render();
          play(currentFile);
        }));
      });
    }

    function renderSections() {
      sectionsEl.replaceChildren();
      lesson.sections.forEach((part) => {
        sectionsEl.append(button(part.name, part.id === section.id, () => {
          section = part;
          currentFile = part.shell;
          render();
          play(currentFile);
        }));
      });
    }

    function renderPages() {
      pagesEl.replaceChildren();
      if (section.shell) {
        pagesEl.append(button("처음부터", currentFile === section.shell, () => {
          currentFile = section.shell;
          render();
          play(currentFile);
        }));
      }
      section.pages.forEach((file) => {
        pagesEl.append(button(pageLabel(file), currentFile === file, () => {
          currentFile = file;
          render();
          play(currentFile);
        }));
      });
    }

    function renderTabs() {
      tabsEl.replaceChildren();
      ROWS.forEach((row) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "row-tab";
        el.classList.toggle("active", currentFile === row.file);
        el.setAttribute("aria-pressed", currentFile === row.file ? "true" : "false");
        const kana = document.createElement("span");
        kana.className = "kana";
        kana.textContent = row.kana;
        const suffix = document.createElement("span");
        suffix.className = "suffix";
        suffix.textContent = "행";
        el.append(kana, suffix);
        el.addEventListener("click", () => {
          if (practice.busy) return;
          currentFile = row.file;
          renderTabs();
          play(row.file);
        });
        tabsEl.append(el);
      });
    }

    function render() {
      renderTabs();
      if (!catalog) return;
      renderLessons();
      renderSections();
      renderPages();
    }

    let selectedWord = null;
    const practice = setupPractice(() => wordMode ? selectedWord : ROWS.find(row => row.file === currentFile) || ROWS[0], { singleWord: wordMode });
    const selection = document.getElementById('wordSelection');
    // Observe the SWF's native pointer event so its original pronunciation still plays.
    stage.addEventListener('pointerdown', event => {
      if (!wordMode) return;
      const bounds = stage.parentElement.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      const row = ROWS.find(item => item.file === currentFile);
      const words = WORD_TARGETS[row.id];
      // The visible stage crops 71 native pixels from the 800 × 520 SWF.
      const index = words.findIndex(word => Math.hypot((x * 800 - word.x) / (word.radius + 4), (y * 409 + 71 - word.y) / ((word.radiusY ?? word.radius) + 4)) <= 1);
      if (index < 0) return;
      if (!practice.changeSelection()) return;
      selectedWord = wordTarget(row.id, index);
      selection.hidden = false;
      selection.style.left = `${selectedWord.x / 800 * 100}%`;
      selection.style.top = `${(selectedWord.y - 71) / 409 * 100}%`;
      selection.style.width = `${(selectedWord.radius + 4) * 2 / 800 * 100}%`;
      selection.style.aspectRatio = `${selectedWord.radius + 4} / ${(selectedWord.radiusY ?? selectedWord.radius) + 4}`;
      selection.setAttribute('aria-label', `선택한 단어: ${selectedWord.reading}`);
      document.getElementById('micHint').textContent = `목표: ${selectedWord.reading} · 녹음 버튼을 누르고 읽어 주세요.`;
    }, true);
    document.getElementById('micBtn').addEventListener('click', event => {
      if (wordMode && !selectedWord) {
        event.stopImmediatePropagation();
        document.getElementById('micHint').textContent = '먼저 화면의 단어를 눌러 선택하고 발음을 들어 주세요.';
      }
    }, true);
    document.querySelectorAll('#pronunciationLink, #returnToWriting, .practice-navigation a').forEach(link => link.addEventListener('click', event => {
      if (practice.busy) { event.preventDefault(); return; }
    }));

    function play(file) {
      practice.clear();
      selectedWord = null;
      selection.hidden = true;
      if (wordMode) document.getElementById('micHint').textContent = '먼저 단어를 눌러 발음을 듣고, 녹음 버튼을 눌러 주세요.';
      const selectedRow = ROWS.find(item => item.file === file);
      renderWarningIcons(document.getElementById("warningOverlays"), selectedRow?.id, wordMode);
      document.getElementById('lessonRowTitle').textContent = selectedRow ? `${selectedRow.kana}행` : '';
      document.querySelector('.lesson-title-suffix').textContent = wordMode ? '발음연습' : '발음';
      const historyUrl = "?file=" + encodeURIComponent(file) + (wordMode ? '&mode=words' : '');
      document.getElementById('pronunciationLink').href = '?file=' + encodeURIComponent(file) + '&mode=words';
      document.getElementById('backToWriting').href = '?file=' + encodeURIComponent(file);
      document.getElementById('returnToWriting').href = '?file=' + encodeURIComponent(file);
      const next = ROWS[ROWS.indexOf(selectedRow) + 1];
      document.getElementById('nextRow').href = next ? '?file=' + encodeURIComponent(next.file) : '/results.html';
      document.getElementById('nextRow').textContent = next ? `다음 ${next.kana}행 →` : '나의 결과 →';
      document.title = `${selectedRow?.kana || ''}행 ${wordMode ? '발음연습' : '획순·글자 연습'} · かな소리`;
      history.replaceState(null, "", historyUrl);
      setStatus(file + " 를 열고 있습니다.");
      stage.replaceChildren();
      const ruffle = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
      if (!ruffle) {
        setStatus("재생 엔진을 불러오지 못했습니다. 인터넷에 연결된 뒤 새로고침해 주세요.", true);
        return;
      }
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      stage.append(player);
      const source = wordMode ? `voca_practice_hiragana/${selectedRow.id}행${selectedRow.id === 'wa' ? '_n' : ''}.swf` : file;
      const open = () => player.load(source + "?v=18-ha").then(() => {
        const row = ROWS.find((item) => item.file === file);
        setStatus(row ? row.kana + "행" : pageLabel(file));
      }).catch((error) => {
        setStatus("이 쪽을 열지 못했습니다. " + (error && error.message ? error.message : ""), true);
      });
      const fontsReady = document.fonts?.load ? document.fonts.load('29px "MS PGothic"') : Promise.resolve();
      fontsReady.then(open, open);
    }

    function locate(file) {
      for (const item of catalog.lessons) {
        for (const part of item.sections) {
          if (part.shell === file || part.pages.includes(file)) return { lesson: item, section: part };
        }
      }
      return {
        lesson: catalog.lessons[0],
        section: catalog.lessons[0].sections.find((part) => part.id === "03")
      };
    }

    render();
    play(currentFile);

    fetch("catalog.json")
      .then((response) => response.json())
      .then((data) => {
        catalog = data;
        const found = locate(preferred);
        lesson = found.lesson;
        section = found.section;
        render();
        if (practice.busy) document.querySelectorAll('.row-tab, #lessons button, #sections button, #pages button').forEach(button => { button.disabled = true; });
      })
      .catch(() => {
        setStatus("목록을 읽지 못했습니다. 이 폴더에서 페이지를 열어 주세요.", true);
      });
  </script>
</body>
</html>
